# Deploy the static export to GitHub Pages on every push to main.
# Based on GitHub's official Next.js Pages starter
# (https://github.com/actions/starter-workflows/blob/main/pages/nextjs.yml), adapted for pnpm + Node 22 and with
# the base path passed via env instead of configure-pages' next.config.js injection (our config is .ts).
# Action versions = latest releases as of 2026-09-30 (gh api repos/<action>/releases/latest).
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # pnpm 11 requires Node >= 22.13
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test  # mapping + seed/model consistency tests (fixture-only, no secrets)
      - name: Build static export
        run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Homepage content: the committed seed (contentful/seed/) until the live space is wired in.
          # To build from Contentful instead: set CONTENT_SOURCE to contentful and add CONTENTFUL_SPACE_ID +
          # CONTENTFUL_DELIVERY_TOKEN as repository secrets (read-only token; never the management token).
          CONTENT_SOURCE: fixture
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
